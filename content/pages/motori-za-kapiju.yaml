    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "Motori za kapiju omogućavaju da klizne ili krilne kapije otvaraš i zatvaraš automatski – putem daljinskog upravljača ili dodatne opreme (npr. WiFi/Bluetooth modula). Automatizacija kapije je praktična u svakodnevnoj upotrebi, posebno kod privatnih kuća, vikendica, poslovnih objekata i parking ulaza gdje je bitna brzina, sigurnost i pouzdan rad.",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "Prilikom odabira motora za kapiju najvažnije je da motor odgovara tipu kapije (klizna ili krilna) i težini kapije. Kod kliznih kapija često se bira motor prema maksimalnoj nosivosti (npr. do 600 kg, do 1000 kg) i uslovima rada (učestalost otvaranja, dužina kapije, vremenski uslovi). Kvalitetan motor radi tiho, stabilno i dugoročno, uz mogućnost ručnog otključavanja u slučaju nestanka struje.",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "Osim samog motora, važnu ulogu imaju i dodatni elementi automatike. Fotoćelije povećavaju sigurnost jer detektuju prepreku i sprječavaju zatvaranje kapije. Signalna lampa upozorava da je kapija u pokretu, a zupčasta letva (šina) je ključna za pravilno prenošenje pogona kod kliznih kapija. Daljinski upravljači i integrisana antena omogućavaju udobnu upotrebu i bolji domet upravljanja.",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "U ovoj kategoriji nalazi se kompletna oprema za automatizaciju kapija – od motora u setu, do pratećih komponenti kao što su daljinski upravljači, signalne lampe, fotoćelije i letve za klizne kapije. Ako nisi siguran koji motor je najbolji za tvoju kapiju, kao osnovni kriterij uzmi: tip kapije, težinu kapije i koliko često se kapija koristi tokom dana. Za zahtjevnije instalacije i dodatnu kontrolu moguće je koristiti i dodatne module (WiFi/Bluetooth), ali nisu obavezni za klasično upravljanje daljinskim upravljačem.",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "",
          "type": "text"
        }
      ]
    },
    {
      "type": "paragraph",
      "children": [
        {
          "text": "Cilj je jednostavan: odabrati pouzdan motor za kapiju i odgovarajuću opremu kako bi sistem radio sigurno, tiho i bez prekida.",
          "type": "text"
        }
