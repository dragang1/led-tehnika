title: "Zamjenska LED sijalica 24W PAR56 RGBW / 6500K"
price: 150
description: |
  Zamjenska LED sijalica 24W PAR56 RGBW / 6500K namijenjena je za bazensku rasvjetu kao zamjena za postojeće PAR56 sijalice. Pogodna je za bazene sa postojećim PAR56 kućištima i omogućava snažno i ravnomjerno osvjetljenje uz mogućnost izbora RGB boja ili bijele svjetlosti (6500K).
  
  Sijalica se isporučuje kao komplet ili pojedinačno, u zavisnosti od varijante. RGBW verzija dolazi u setu sa RF kontrolerom za promjenu boja i efekata, dok bijela 6500K verzija pruža klasično bijelo osvjetljenje bazena.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 24 W
  Tip sijalice: PAR56 (zamjenska)
  Boja svjetla: RGBW / 6500K
  Prečnik: fi 177 mm
  Napajanje: 12 V
  Kompatibilnost: standardna PAR56 kućišta (npr. Astral)
  
  VARIJANTE
  RGB set: 1 LED sijalica + RF kontroler
  Bijela verzija: 1 LED sijalica 6500K
  
  PREDNOSTI
  Jednostavna zamjena postojeće PAR56 sijalice
  Kompatibilna sa standardnim bazenskim kućištima
  Mogućnost izbora RGB ili bijele svjetlosti
  Pouzdano i dugotrajno rješenje za bazensku rasvjetu
  
  PREPORUČENA UPOTREBA
  Kao zamjenska bazenska LED sijalica za PAR56 kućišta u privatnim i javnim bazenima.
