slug: "toroidni-bazenski-trafo-50-w-ip-68-12-v-ac"
title: "Toroidni bazenski trafo 50W IP68 12V AC"
price: 50
description: |
  Toroidni bazenski trafo 50W IP68 namijenjen je za napajanje bazenske i podvodne LED rasvjete na sigurnom niskom naponu od 12V AC. Idealan je za manje bazene, fontane, jezerca i instalacije sa manjim brojem LED reflektora gdje je potrebna pouzdana i sigurna električna energija.
  
  Toroidna tehnologija omogućava stabilan izlazni napon, tihi rad i dug vijek trajanja transformatora. Zahvaljujući vodootpornom kućištu sa stepenom zaštite IP68, trafo je pogodan za ugradnju u vlažnim i zahtjevnim uslovima, uključujući spoljašnju i podvodnu montažu.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 50 W
  Ulazni napon: 220–240 V AC
  Izlazni napon: 12 V AC
  Tip transformatora: toroidni
  Stepen zaštite: IP68 (potpuno vodootporno)
  Namjena: bazenska i podvodna rasvjeta
  
  PREDNOSTI TOROIDNOG TRAFA
  Sigurno napajanje LED rasvjete niskim naponom
  Stabilan i pouzdan rad pri manjem opterećenju
  Pogodan za LED reflektore i manju bazensku rasvjetu
  Vodootporno kućište za vanjsku i podvodnu ugradnju
  Dug vijek trajanja i minimalno održavanje
  
  PREPORUČENA UPOTREBA
  Za manje bazene, fontane, jezerca i dekorativnu LED rasvjetu koja radi na 12V AC.
