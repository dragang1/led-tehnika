title: "Toroidni bazenski trafo 150W IP68 12V AC"
price: 100
description: |
  Toroidni bazenski trafo 150W IP68 namijenjen je za napajanje bazenske i podvodne LED rasvjete na sigurnom niskom naponu od 12V AC. Idealan je za veće bazene, fontane, slapove i instalacije sa više LED reflektora ili jačom rasvjetom gdje je potrebna veća snaga i stabilan rad.
  
  Toroidna tehnologija obezbjeđuje stabilan izlazni napon, tihi rad i dug vijek trajanja transformatora. Zahvaljujući potpuno vodootpornom kućištu sa stepenom zaštite IP68, trafo je pogodan za ugradnju u vlažnim i zahtjevnim uslovima, uključujući spoljašnju i podvodnu montažu.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 150 W
  Ulazni napon: 220–240 V AC
  Izlazni napon: 12 V AC
  Tip transformatora: toroidni
  Stepen zaštite: IP68 (potpuno vodootporno)
  Namjena: bazenska i podvodna rasvjeta
  
  PREDNOSTI TOROIDNOG TRAFA
  Sigurno napajanje LED rasvjete niskim naponom
  Stabilan i pouzdan rad i pri većem opterećenju
  Pogodan za više LED reflektora ili jaču rasvjetu
  Vodootporno kućište za vanjsku i podvodnu ugradnju
  Dug vijek trajanja i minimalno održavanje
  
  PREPORUČENA UPOTREBA
  Za bazene, fontane, slapove, jezerca i druge instalacije sa LED rasvjetom koje zahtijevaju trafo veće snage (150W).
