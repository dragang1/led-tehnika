slug: "toroidni-bazenski-trafo-100-w-ip-68-12-v-ac"
title: "Toroidni bazenski trafo 100W IP68 12V AC"
price: 75
description: |
  Toroidni bazenski trafo 100W IP68 namijenjen je za napajanje bazenske i podvodne LED rasvjete na sigurnom niskom naponu od 12V AC. Idealan je za upotrebu u bazenima, fontanama, jezercima i drugim vlažnim ili podvodnim okruženjima gdje je potrebna maksimalna sigurnost i pouzdan rad.
  
  Zahvaljujući toroidnoj tehnologiji, transformator omogućava stabilan izlazni napon, tihi rad i dug vijek trajanja. Potpuno vodootporno kućište sa stepenom zaštite IP68 omogućava instalaciju u zahtjevnim uslovima, uključujući direktan kontakt sa vlagom ili vodom.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 100 W
  Ulazni napon: 220–240 V AC
  Izlazni napon: 12 V AC
  Tip transformatora: toroidni
  Stepen zaštite: IP68 (potpuno vodootporno)
  Namjena: bazenska i podvodna rasvjeta
  
  PREDNOSTI TOROIDNOG TRAFA
  Sigurno napajanje bazenske rasvjete niskim naponom
  Stabilan i pouzdan rad bez oscilacija
  Pogodan za LED reflektore, LED trake i podvodnu rasvjetu
  Vodootporno kućište za vanjsku i podvodnu ugradnju
  Dug vijek trajanja i minimalno održavanje
  
  PREPORUČENA UPOTREBA
  Za bazene, fontane, slapove, jezerca i druge instalacije sa LED rasvjetom koja radi na 12V AC.
