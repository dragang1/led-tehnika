title: "Motor za kapiju Smart Panther 600 / komplet"
price: 450
description: |
  Motor za kliznu kapiju Smart Panther 600 (set) namijenjen je za automatsko otvaranje kliznih kapija težine do 600 kg. Komplet sadrži sve potrebne komponente za sigurnu i pouzdanu automatizaciju kapije u privatnim i poslovnim objektima.
  Ovaj motor za kliznu kapiju spada u pouzdana rješenja iz kategorije motora za kapije, te je pogodan za korisnike koji žele stabilan i dugotrajan sistem automatizacije.
  
  TEHNIČKE KARAKTERISTIKE
  
  Namjena: klizne kapije
  Maksimalna težina kapije: do 600 kg
  Tip motora: brushless (bez četkica)
  Napajanje: 220 V
  Deblokada: ručno otključavanje u slučaju nestanka struje
  Garancija: 3 godine
  Opcija: WiFi / Bluetooth modul (nije obavezan)
  
  PREDNOSTI MOTORA SMART PANTHER 600
  
  Tih i stabilan rad, dug vijek trajanja i minimalno održavanje čine ovaj motor za kapiju pouzdanim rješenjem za svakodnevnu upotrebu.
  Sigurnosni sistem sa fotoćelijama i signalnom lampom omogućava bezbjedan rad, uz mogućnost daljinskog i pametnog upravljanja kapijom.
  
  PAKET SADRŽI
  
  1 motor
  2 RF daljinska upravljača
  4 m zupčaste letve
  Par fotoćelija
  LED signalna lampa
  Temeljna ploča za montažu
  Anker vijci
  Samourezujući vijci za šinu
  
  ČESTO PITANJE
  
  Da li je WiFi modul obavezan?
  Ne. Motor radi potpuno funkcionalno uz daljinske upravljače. WiFi/Bluetooth modul je opcija za naprednu kontrolu.
