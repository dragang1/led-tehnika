title: "Zidna LED lampa 12 × 3W 3000K 220V"
price: 45
description: |
  Zidna LED lampa 12 × 3W 3000K namijenjena je za dekorativno i funkcionalno osvjetljenje zidova, fasada i ulaznih prostora. Topla bijela svjetlost (3000K) pruža ugodan ambijent i naglašava arhitektonske detalje objekta.
  
  Lampa koristi ukupno 12 LED izvora snage 3W, što omogućava snažno, ali energetski efikasno osvjetljenje. Pogodna je za stambene i poslovne objekte, kao i za vanjsku ili unutrašnju upotrebu (u zavisnosti od mjesta ugradnje).
  
  TEHNIČKE SPECIFIKACIJE
  Tip rasvjete: zidna LED lampa
  Snaga: 12 × 3 W
  Boja svjetla: topla bijela (3000K)
  Napajanje: 220 V
  Garancija: 1 godina
  
  PREDNOSTI
  Moderan dizajn za savremene objekte
  Topla i prijatna svjetlost
  Energetski efikasna LED tehnologija
  Jednostavna montaža
  Dug vijek trajanja
  
  PREPORUČENA UPOTREBA
  Za osvjetljenje fasada, zidova, ulaza, terasa, hodnika i sličnih prostora.
