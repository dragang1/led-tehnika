title: "Ugradbena LED Sijalica 24W PAR56 (RGB / 6500K)"
price: 280
description: |
  Ugradbena LED sijalica 24W PAR56 namijenjena je za podvodnu rasvjetu bazena sa folijom i betonskih bazena. Ovaj tip bazenske LED rasvjete omogućava snažno i ravnomjerno osvjetljenje bazena uz mogućnost izbora bijele svjetlosti (6500K) ili RGB osvjetljenja sa promjenom boja.
  
  Sijalica ima integrisani DMX kontroler, što omogućava napredno upravljanje bojama i efektima bez dodatnih modula. Zahvaljujući RF upravljaču, boje i režimi osvjetljenja mogu se kontrolisati sa udaljenosti do 30 metara, što pruža maksimalnu praktičnost i fleksibilnost.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 24 W
  Napajanje: 12 V AC
  Svjetlosni tok: 2400 lm
  Tip sijalice: PAR56
  Boja svjetla: RGB / 6500K
  Kontrola: integrisani DMX kontroler
  Upravljač: RF daljinski do 30 m
  Stepen zaštite: IP68 (potpuno vodootporno)
  Materijal kućišta: ABS + PS
  Certifikati: CE, RoHS
  
  DIMENZIJE
  Kućište: 230 mm × 140 mm
  Maska: 290 mm
  
  PREDNOSTI
  Snažno i ravnomjerno osvjetljenje bazena
  Mogućnost izbora bijele ili RGB rasvjete
  Daljinsko upravljanje bojama i efektima
  Pogodna za stalni rad u vodi
  Visok stepen zaštite IP68 za maksimalnu sigurnost
  
  PREPORUČENA UPOTREBA
  Za bazene sa folijom i betonske bazene kao trajno rješenje za podvodnu LED rasvjetu.
