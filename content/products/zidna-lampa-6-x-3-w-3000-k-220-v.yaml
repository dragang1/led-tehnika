slug: "zidna-lampa-6-x-3-w-3000-k-220-v"
title: "Zidna LED lampa 6 × 3W 3000K 220V"
price: 25
description: |
  Zidna LED lampa 6 × 3W 3000K namijenjena je za dekorativno i funkcionalno osvjetljenje zidova, fasada, ulaza i prolaznih prostora. Topla bijela svjetlost (3000K) stvara prijatan ambijent i naglašava arhitektonske elemente objekta.
  
  Sa ukupno 6 LED izvora snage 3W, ova zidna lampa pruža uravnotežen odnos između jačine svjetla i potrošnje energije. Pogodna je za prostore gdje je potrebna vidljivija rasvjeta nego kod slabijih modela, ali bez pretjerane jačine osvjetljenja.
  
  TEHNIČKE SPECIFIKACIJE
  Tip rasvjete: zidna LED lampa
  Snaga: 6 × 3 W
  Boja svjetla: topla bijela (3000K)
  Napajanje: 220 V
  Garancija: 1 godina
  
  PREDNOSTI
  Uravnotežena jačina svjetla
  Topla i ugodna rasvjeta
  Energetski efikasna LED tehnologija
  Jednostavna montaža
  Dug vijek trajanja
  
  PREPORUČENA UPOTREBA
  Za fasade, ulazne prostore, stepeništa, hodnike i dekorativno zidno osvjetljenje.
