title: "Zidna LED lampa 8 × 3W 3000K 220V"
price: 30
description: |
  Zidna LED lampa 8 × 3W 3000K namijenjena je za dekorativno i funkcionalno osvjetljenje fasada, zidova, ulaza i većih prolaznih prostora. Topla bijela svjetlost (3000K) pruža prijatan ambijent i jasno ističe arhitektonske detalje objekta.
  
  Sa ukupno 8 LED izvora snage 3W, ova zidna lampa daje jače osvjetljenje u odnosu na slabije modele, ali zadržava energetski efikasan rad zahvaljujući LED tehnologiji. Pogodna je za prostore gdje je potrebno izraženije zidno osvjetljenje bez prejakog blještanja.
  
  TEHNIČKE SPECIFIKACIJE
  Tip rasvjete: zidna LED lampa
  Snaga: 8 × 3 W
  Boja svjetla: topla bijela (3000K)
  Napajanje: 220 V
  Garancija: 1 godina
  
  PREDNOSTI
  Jače i ravnomjernije osvjetljenje zidova
  Topla i ugodna svjetlost
  Energetski efikasna LED tehnologija
  Jednostavna montaža
  Dug vijek trajanja
  
  PREPORUČENA UPOTREBA
  Za fasade, ulaze, stepeništa, hodnike i prostore gdje je potrebna jača zidna rasvjeta.
