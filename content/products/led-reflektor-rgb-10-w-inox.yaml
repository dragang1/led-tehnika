slug: "led-reflektor-rgb-10-w-inox"
title: "LED reflektor RGB 10W INOX – IP68 za fontane i bazene"
price: 45
description: |
  LED reflektor RGB 10W INOX namijenjen je za dekorativno osvjetljenje fontana, slapova, jezerca i bazena. Zahvaljujući visokoj IP68 zaštiti, reflektor je potpuno vodootporan i pogodan za dugotrajan rad pod vodom.
  
  Kućište od INOX materijala osigurava otpornost na koroziju i dug vijek trajanja, dok RGB LED tehnologija omogućava promjenu boja i stvaranje atraktivnih svjetlosnih efekata. Reflektor radi na naponu od 12 V, što ga čini sigurnim za upotrebu u vlažnim i vodenim okruženjima.
  
  Ugrađeni IR kontroler omogućava jednostavno upravljanje bojama i efektima sa udaljenosti od 2 do 3 metra. Idealan je izbor za privatne i komercijalne projekte gdje je potrebna pouzdana i estetska LED rasvjeta. 
  
  Tehničke specifikacije
  Snaga: 10W
  Boja svjetla: RGB
  Napon: 12 V
  Svjetlosni tok: 1000 lm
  Zaštita: IP68
  Materijal kućišta: INOX
  Kontroler: IR (2–3 m)
  Dimenzije: V84 × Ø76 mm
