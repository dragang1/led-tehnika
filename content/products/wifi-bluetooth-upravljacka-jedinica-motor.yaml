title: "WiFi / Bluetooth modul za motor za kapiju (Tuya / Smart Life)"
price: 70
description: |
  WiFi / Bluetooth modul za motor za kapiju omogućava upravljanje automatskom kapijom putem pametnog telefona ili drugog smart uređaja. Modul se povezuje sa motorom kapije i omogućava daljinsko otvaranje i zatvaranje kapije bez potrebe za klasičnim daljinskim upravljačem.
  
  Upravljačka jedinica podržava popularne aplikacije Tuya i Smart Life, što omogućava jednostavnu instalaciju, kontrolu sa bilo koje lokacije i integraciju sa pametnim kućnim sistemima. Pored WiFi kontrole, modul podržava i Bluetooth vezu za lokalno upravljanje.
  
  TEHNIČKE KARAKTERISTIKE
  Tip uređaja: WiFi / Bluetooth upravljačka jedinica
  Namjena: motori za automatske kapije
  Kontrola: pametni telefon (Android / iOS)
  Podržane aplikacije: Tuya, Smart Life
  Način povezivanja: WiFi + Bluetooth
  
  PREDNOSTI
  Upravljanje kapijom putem mobilne aplikacije
  Otvaranje i zatvaranje kapije sa bilo koje lokacije
  Kompatibilnost sa smart home sistemima
  Jednostavna instalacija i korištenje
  Nije obavezan za osnovni rad motora (opciona nadogradnja)
  
  PREPORUČENA UPOTREBA
  Kao dodatna oprema za motore za klizne i krilne kapije radi pametnog upravljanja.
