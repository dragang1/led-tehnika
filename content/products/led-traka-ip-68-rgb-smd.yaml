title: "LED Traka IP68 RGB SMD"
price: 15
description: |
  LED traka IP68 RGB SMD je vodootporna fleksibilna LED traka namijenjena za dekorativno i funkcionalno osvjetljenje u vlažnim i vanjskim uslovima. Idealna je za ugradnju u bazene, fontane, terase, kupatila i eksterijere gdje je potrebna pouzdana RGB rasvjeta sa visokom zaštitom od vode.
  
  Zahvaljujući IP68 zaštiti i silikonskom kućištu, LED traka je otporna na vlagu i prskanje, dok RGB tehnologija omogućava promjenu boja i različite svjetlosne efekte.
  
  Tehničke specifikacije
  Dimenzije: 1 cm × 0,5 cm
  Dužina: do 22m po segmentu
  Snaga: 15W / 1 m
  Napon: 24V DC (4-pin)
  Zaštita: IP68
  Materijal: Fleksibilni silikon
  
  Instalacija:
  - 3M samoljepljiva + RTV silikon
  
  LED traku je moguće nastavljati u seriji.
  *Kontroler nije uključen u cijenu.*
  
  Za najbolju ponudu obratite se nasem timu,jer traku sjecemo na duzinu i pravimo idejni projekat i semiranje.
