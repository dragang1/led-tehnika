description: |
  Signalna lampa za motor za kapiju (LED Panther) služi kao upozorenje da je automatska kapija u pokretu. Montira se uz motor/automatiku i povećava sigurnost, posebno noću i na prometnim ulazima.
  
  TEHNIČKE SPECIFIKACIJE
  Napon: 220 V
  Snaga: LED 6 W
  Integrisana antena: da (povećava domet daljinskih upravljača)
  Zvučni signal: da (prilikom pokretanja kapije)
  
  PREDNOSTI
  Vidljivo upozorenje kada se kapija otvara/zatvara
  Povećava sigurnost za vozila i pješake
  Bolji domet daljinskih upravljača zahvaljujući anteni
  Jednostavna ugradnja uz automatiku kapije
  
  PREPORUČENA UPOTREBA
  Uz motore za klizne i krilne kapije kao dio sistema automatizacije.
