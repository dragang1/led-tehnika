title: "LED reflektor RGB 18W INOX"
price: 160
description: |
  LED reflektor RGB 18W INOX namijenjen je za podvodnu i vanjsku rasvjetu fontana, slapova, jezeraca i drugih vodenih površina. Zahvaljujući snažnoj RGB LED rasvjeti i visokom stepenu zaštite IP68, reflektor je pogodan za stalni rad u vodi ili u vlažnim uslovima.
  
  Kućište od INOX materijala obezbjeđuje otpornost na koroziju i dug vijek trajanja, čak i u zahtjevnim spoljašnjim okruženjima. RGB osvjetljenje omogućava promjenu boja i svjetlosnih efekata, a upravljanje se vrši putem RF kontrolera sa dometom do 30 metara.
  
  TEHNIČKE SPECIFIKACIJE
  Snaga: 18 W
  Boja svjetla: RGB
  Napajanje: 12 V
  Svjetlosni tok: 1760 lm
  Materijal kućišta: INOX
  Stepen zaštite: IP68 (potpuno vodootporno)
  Dimenzije: V 100 mm × Ø 160 mm
  Kontrola: RF kontroler (domet do 30 m)
  
  PREDNOSTI
  Snažno i ravnomjerno RGB osvjetljenje
  Otpornost na vodu i vlagu (IP68)
  INOX kućište otporno na koroziju
  Daljinsko upravljanje bojama i efektima
  Pogodan za trajnu podvodnu ugradnju
  
  PREPORUČENA UPOTREBA
  Za fontane, slapove, jezerca, bazene i dekorativnu podvodnu LED rasvjetu.
