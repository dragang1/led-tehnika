title: "Čelična zupčasta letva za klizne kapije – 1 m"
price: 20
description: |
  Čelična zupčasta letva za klizne kapije namijenjena je za prenos pogona sa motora na kapiju. Presvučena je plastikom, što omogućava tiši i stabilniji rad sistema automatizacije.
  
  Letva dolazi u dužini od 1 metra i isporučuje se sa 4 nosača za jednostavno i sigurno fiksiranje na kapiju. Pogodna je za klizne kapije nosivosti do 1000 kg, kako za privatne, tako i za industrijske objekte.
  
  TEHNIČKE SPECIFIKACIJE
  Materijal: čelik (presvučen plastikom)
  Tip: zupčasta letva
  Dužina: 1 m
  Nosivost kapije: do 1000 kg
  Montaža: 4 nosača za fiksiranje
  
  PREDNOSTI
  Tihi rad zahvaljujući plastičnoj oblozi
  Pouzdan prenos snage sa motora na kapiju
  Jednostavna montaža
  Kompatibilna sa većinom motora za klizne kapije
  
  PREPORUČENA UPOTREBA
  Za ugradnju uz motore za klizne kapije u privatnim i industrijskim objektima.
