slug: "18w-ip68-led-bazenska-lampa-rgb-vodootporna"
title: "Nadgradbeni reflektor 18W RGB sa RF kontrolerom"
price: 200
description: |
  LED bazenski reflektor 18W RGB-W sa RF daljinskim upravljačem 
  Epoxy inside za dugovjecnost
  Nadgradbeni LED bazenski reflektor snage 18W namijenjen je za osvjetljenje svih tipova bazena. Zahvaljujući RGB-W tehnologiji, omogućava izbor boja, bijelog svjetla i različitih svjetlosnih efekata, uz jednostavno upravljanje pomoću RF daljinskog kontrolera.
  Reflektor je IP68 vodootporan, pogodan za stalni rad pod vodom. Slim dizajn omogućava jednostavnu montažu na zid bazena (nadgradna ugradnja). Napajanje je 12V AC/DC, što osigurava sigurnu upotrebu u bazenskom okruženju.
  Karakteristike:
  Snaga: 18W
  Tip svjetla: RGB-W
  Upravljanje: RF daljinski upravljač
  Napon: 12V AC/DC
  Montaža: Nadgradna (zid bazena)
  Zaštita: IP68
  Dimenzije: Ø 29 cm, debljina 4.5 cm
  Garancija: 1 godina
  Idealan izbor za dekorativno i funkcionalno osvjetljenje privatnih i hotelskih bazena
