title: "Zidna LED lampa 4 × 3W 3000K 220V"
price: 20
description: |
  Zidna LED lampa 4 × 3W 3000K namijenjena je za dekorativno i funkcionalno osvjetljenje zidova, hodnika, ulaza i manjih fasadnih površina. Topla bijela svjetlost (3000K) stvara ugodan ambijent i diskretno naglašava arhitektonske detalje prostora.
  
  Lampa koristi ukupno 4 LED izvora snage 3W, što je čini pogodnom za prostore gdje nije potrebna jaka rasvjeta, već ambijentalno ili usmjereno osvjetljenje. Zahvaljujući LED tehnologiji, potrošnja energije je mala uz dug vijek trajanja.
  
  TEHNIČKE SPECIFIKACIJE
  Tip rasvjete: zidna LED lampa
  Snaga: 4 × 3 W
  Boja svjetla: topla bijela (3000K)
  Napajanje: 220 V
  Garancija: 1 godina
  
  PREDNOSTI
  Diskretno i elegantno osvjetljenje
  Topla i prijatna svjetlost
  Niska potrošnja električne energije
  Jednostavna montaža
  Dug vijek trajanja LED izvora
  
  PREPORUČENA UPOTREBA
  Za hodnike, stepeništa, ulazne prostore, terase i dekorativno zidno osvjetljenje.
